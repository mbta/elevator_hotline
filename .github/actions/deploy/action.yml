name: Deploy
description: Deploys new Lambda function code

inputs:
  aws-role:
    description: AWS role to assume
    required: true
  dry-run:
    description: If truthy, the deploy will be a dry run
    required: false
    default: ""
  environment:
    description: Environment to deploy to (dev/prod)
    required: true

runs:
  using: composite
  steps:
    - uses: $/.github/actions/setup

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: us-east-1
        role-to-assume: ${{ inputs.aws-role }}

    - name: Run deploy script
      shell: bash
      run: |
        scripts/deploy.sh \
          ${INPUTS_DRY_RUN:+-d} \
          ${INPUTS_ENVIRONMENT}
      env:
        INPUTS_DRY_RUN: ${{ inputs.dry-run }}
        INPUTS_ENVIRONMENT: ${{ inputs.environment }}
